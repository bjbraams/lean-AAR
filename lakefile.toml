name = "Main"
version = "0.1.0"
defaultTargets = ["Main"]
buildDir = ".lake/build-DLMF"

[leanOptions]
# Mathlib convention: undeclared names in statements are errors, not auto-bound implicits.
autoImplicit = false
relaxedAutoImplicit = false

[[lean_lib]]
name = "Main"
roots = ["DLMF", "ToMathlib"]
globs = [
  "DLMF", "DLMF.+", "ToMathlib", "ToMathlib.+"
]

[[lean_exe]]
name = "main"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Shared upgrade snapshot, 2026-10-18: Lean v4.36.0-rc1.
rev = "911003dd6dea5df215dff57f2717be762e11a6ca"

[[require]]
name = "doc-gen4"
scope = "leanprover"
rev = "v4.36.0-rc1"

[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "5cdecf40e99d5a5ad0833afff31f5b007d68a149"
